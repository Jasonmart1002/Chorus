[package]
name = "chorus"
version = "0.4.0"
edition = "2021"
description = "A native desktop app for orchestrating multiple AI coding agents (Claude, Codex, Gemini) in parallel"
license = "MIT"
repository = "https://github.com/Jasonmart1002/Chorus"

[lib]
name = "chorus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "chorus"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
which = "7"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
